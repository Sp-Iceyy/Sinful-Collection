<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sinful Collections</title>
    <style>
      :root {
        --paper: #0b090b;
        --panel: #151116;
        --line: #342c32;
        --pink: #ff4f9a;
        --soft-pink: #ff9bc4;
        --ink: #f8f1f5;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at top, rgba(255, 79, 154, 0.15), transparent 40%), var(--paper);
        color: var(--ink);
        font-family: 'Segoe UI', sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(21,17,22,0.98), rgba(11,9,11,0.96));
      }
      .splash::before {
        content: '';
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(255,79,154,0.18);
        pointer-events: none;
      }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }
      .mark {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 32px;
        font-weight: 700;
        color: #190c13;
        background: var(--pink);
        box-shadow: 0 0 30px rgba(255,79,154,0.45);
      }
      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 3.2rem);
        letter-spacing: -0.08em;
        line-height: 0.92;
        font-weight: 700;
        color: var(--ink);
      }
      .accent {
        color: var(--pink);
      }
      .tag {
        margin-top: 8px;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--soft-pink);
      }
      .loader {
        width: 146px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
        position: relative;
        margin-top: 12px;
      }
      .loader::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(90deg, var(--pink), var(--soft-pink));
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="brand">
        <div class="mark">♥</div>
        <div>
          <h1>Sinful <span class="accent">Collections</span></h1>
          <div class="tag">Private archive</div>
        </div>
        <div class="loader" aria-hidden="true"></div>
      </div>
    </div>
  </body>
</html>
